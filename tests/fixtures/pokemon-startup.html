<!doctype html><meta charset="utf-8"><title>Pokemon startup checks</title><style>body{background:#101219;color:white;font:15px system-ui}iframe{width:720px;height:470px}pre{white-space:pre-wrap}</style><button id="start">Test games</button><p id="status">Ready</p><div id="frames"></div><pre id="report"></pre><script type="module">
const params=new URLSearchParams(location.search),games=(await(await fetch('/content/pokemon-space/manifest.json')).json()).games.filter(g=>g.core&&(!params.has('ids')||params.get('ids').split(',').includes(String(g.id))));
function docs(frame){const result=[],seen=new Set();function walk(d){if(!d||seen.has(d))return;seen.add(d);result.push(d);for(const el of d.querySelectorAll('*'))if(el.shadowRoot)walk(el.shadowRoot);for(const f of d.querySelectorAll('iframe'))try{walk(f.contentDocument)}catch{}}try{walk(frame.contentDocument)}catch{}return result}
document.querySelector('#start').onclick=async function(){this.disabled=true;const results=[];for(const g of games){document.querySelector('#status').textContent='Testing '+g.name;const f=document.createElement('iframe');f.src='/player.html?kind=game&id='+g.id;document.querySelector('#frames').append(f);const begin=Date.now();let clicked=false,running=false,error='',all=[];while(Date.now()-begin<90000){all=docs(f);for(const d of all){const b=d.querySelector('#start');if(b&&!clicked&&typeof b.onclick==='function'){clicked=true;b.click()}if(d.documentElement?.dataset.pokemonState==='running')running=true;if(d.documentElement?.dataset.pokemonState==='error')error=d.querySelector('#status')?.textContent||'Error';}if(running||error)break;await new Promise(r=>setTimeout(r,500));}results.push({id:g.id,name:g.name,clicked,running,error,text:all.map(d=>d.body?.innerText||'').join('\n').slice(-1200),seconds:(Date.now()-begin)/1000});document.querySelector('#report').textContent=JSON.stringify(results,null,2);f.remove();}document.querySelector('#status').textContent='Complete';};
</script>
