<!doctype html><meta charset="utf-8"><title>Nova new-game audit</title><style>body{background:#111;color:#ddd;font:14px system-ui}iframe{width:580px;height:360px;border:1px solid #555}pre{white-space:pre-wrap}</style><h1>New game loading audit</h1><button id="start">Start audit</button><p id="status">Ready</p><div id="frames"></div><pre id="report"></pre><script type="module">
const games=(await(await fetch('/library-games.json')).json()).filter(g=>Number(g.id)>=880&&(!new URLSearchParams(location.search).get('ids')||new URLSearchParams(location.search).get('ids').split(',').includes(String(g.id))));let queue=0,results=[];const params=new URLSearchParams(location.search),seconds=Number(params.get('seconds')||10);
function scan(frame){let docs=[],seen=new Set();function walk(d){if(!d||seen.has(d))return;seen.add(d);docs.push(d);for(const el of d.querySelectorAll('*'))if(el.shadowRoot)walk(el.shadowRoot);for(const f of d.querySelectorAll('iframe'))try{walk(f.contentDocument)}catch{}}try{walk(frame.contentDocument)}catch{}return docs}
async function run(){while(queue<games.length){const g=games[queue++],frame=document.createElement('iframe'),errors=[],bound=new WeakSet();frame.src='/player.html?kind=game&id='+g.id;document.querySelector('#frames').append(frame);const monitor=setInterval(()=>{for(const d of scan(frame)){if(bound.has(d))continue;bound.add(d);if(d.defaultView)d.defaultView.alert=message=>errors.push('Game notice: '+message);d.defaultView?.addEventListener('error',e=>{if(e.message)errors.push(e.message+' '+(e.error?.stack||''))});}},150);await new Promise(r=>setTimeout(r,seconds*1000));clearInterval(monitor);const docs=scan(frame),text=docs.map(d=>d.body?.innerText||'').join('\n'),canvases=docs.flatMap(d=>[...d.querySelectorAll('canvas')]).map(c=>({width:c.width,height:c.height})),failed=/required game or app file could not|couldn.t load this|404 NOT_FOUND|could not be found|Ruffle failed|The game stopped|Internal Service Worker Error|Failed to (fetch|load)|Unable to (load|parse)|ReferenceError|TypeError|SyntaxError|WebGL not supported/i.test(text);results.push({documents:docs.map(d=>({dataset:{...d.documentElement?.dataset},scripts:[...d.querySelectorAll("script[src]")].map(s=>s.getAttribute("src"))})),id:g.id,name:g.name,status:failed||errors.length?'review':canvases.some(c=>c.width>16&&c.height>16)?'canvas-present':'review',canvases,errors:[...new Set(errors)],text:text.slice(0,1400),urls:docs.map(d=>d.URL||'shadow-root')});frame.remove();document.querySelector('#status').textContent=results.length+'/'+games.length;document.querySelector('#report').textContent=JSON.stringify(results,null,2)}}
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;await Promise.all([run(),run()]);document.querySelector('#status').textContent+=' complete'};
if(params.has('run'))document.querySelector('#start').click();
</script>
