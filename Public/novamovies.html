<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaMOVIE</title><style>html,body{margin:0;height:100%;background:#0f0f0f;color:#eee;font:14px system-ui;overflow:hidden}header{height:52px;box-sizing:border-box;display:flex;align-items:center;justify-content:flex-end;padding:8px 18px;gap:10px;background:#0f0f0fea;border-bottom:1px solid #ffffff18}header img{width:28px;height:28px;object-fit:contain}header strong{font-size:17px;letter-spacing:-.4px}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#090909}#loading{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:#0f0f0f;z-index:2}#loading[hidden],button[hidden]{display:none}button{padding:12px 22px;border:1px solid #ffffff28;border-radius:12px;background:#ffffff0b;color:#eee;cursor:pointer}.spinner{height:30px;width:30px;border:2px solid #ffffff20;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}</style></head><body><section id="loading"><span class="spinner"></span><h1>NovaMOVIE</h1><p id="status" role="status">Connecting through Nova…</p><button id="retry" hidden>Try again</button></section><script src="/src/connection.js"></script><script src="/src/novamovies.js"></script></body></html>
