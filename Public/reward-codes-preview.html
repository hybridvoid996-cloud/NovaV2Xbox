<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Reward Codes · Preview</title><style>body{background:radial-gradient(ellipse at top left,#315754,transparent 70%),#111820;color:white;font:14px Segoe UI,sans-serif;margin:0;padding:40px}main{max-width:1050px;margin:auto}small{display:block}header{padding:24px;border:1px solid #fff2;border-radius:18px;background:#ffffff07;margin-bottom:28px}</style></head><body><main><header><small>PERSONALIZE YOUR WORLD · SAMPLE PREVIEW</small><h1>Code</h1></header><section id="codes"></section></main><script type="module">import {rewardCodeUI} from './src/reward-code-ui.js';const rows=[{code:'NOVA-WEEKEND',ownerName:'Nova Owner',createdAt:Date.now(),expiresAt:Date.now()+86400000,coins:20000,xp:500,status:'active'},{code:'THANK-YOU',ownerName:'Alex',createdAt:Date.now()-86400000,expiresAt:Date.now()+172800000,coins:5000,status:'redeemed'},{code:'SUMMER-GIFT',ownerName:'Nova Owner',createdAt:Date.now()-259200000,expiresAt:Date.now()-86400000,coins:10000,status:'expired'}];await rewardCodeUI(document.getElementById('codes'),async(action,b)=>{if(action==='redeem'){rows.find(c=>c.code===b.code).status='redeemed';return {progress:{coins:20000}}}return {codes:rows}});</script></body></html>
