<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nova Player</title><link rel="stylesheet" href="src/player.css?v=20261029-motion374"><link rel="stylesheet" href="src/player-launch.css?v=20261020-flight222"><link rel="stylesheet" href="src/laptop-motion.css?v=20261019-recovery193"><link rel="stylesheet" href="src/ghost-loading.css?v=20261029-motion374"><link rel="stylesheet" href="src/cloud-picker-glass.css?v=20261029-motion374"><link rel="stylesheet" href="src/player-icon-loader.css?v=20261102-icon455"></head><body><main id="stage"></main><nav id="cloud-controls" aria-label="Cloud player controls" hidden><button id="cloud-switch" hidden>Switch cloud</button><button id="cloud-home" aria-label="Exit cloud game to Nova Home">⌂ Nova Home</button></nav><section id="loader"><button id="back" aria-label="Back to library">‹ <span>Back</span></button><div class="loading-copy"><img id="launch-icon" src="Nova12.png" alt=""><small id="eyebrow">NOVA CLOUD PLAYER</small><h1 id="title">Preparing your game</h1><p id="message" role="status">Starting the connection…</p><div class="track" role="progressbar" aria-label="Launch progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><p class="hint">Launching through Nova’s proxy</p><div id="actions" hidden><button id="retry">Try again</button><button id="return">Back to library</button></div></div></section><dialog id="cloud-picker" aria-labelledby="cloud-picker-title" aria-describedby="cloud-picker-description"><button id="cloud-cancel" aria-label="Cancel cloud launch">×</button><div class="cloud-choice-game"><img id="cloud-game-art" alt=""><div><small>NOVA CLOUD GAMING</small><h2 id="cloud-game-name"></h2></div></div><h1 id="cloud-picker-title">Choose your Nova Server</h1><p id="cloud-picker-description">Pick a server and settle in. Availability and queues can vary.</p><div id="cloud-options"></div><p class="cloud-choice-note">Your game will start after you choose.</p></dialog><script type="module">import {styleLaunchArtwork} from './src/player-icon-loader.mjs';const items=await fetch('library-games.json').then(r=>r.json());const item=items.find(x=>String(x.id)==='557');styleLaunchArtwork(document,item);document.getElementById('title').textContent=item.name;document.getElementById('eyebrow').textContent='LOADER PREVIEW';document.getElementById('message').textContent='Preparing game files…';document.querySelector('.track').classList.add('waiting');document.querySelector('.track').removeAttribute('aria-valuenow');document.getElementById('back').onclick=()=>location.href='__offline-home.html';</script></body></html>
