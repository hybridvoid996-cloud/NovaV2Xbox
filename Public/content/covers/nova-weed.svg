<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050a07"/><stop offset=".6" stop-color="#0c2414"/><stop offset="1" stop-color="#173d22"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="45%"><stop offset="0" stop-color="#5dff8a" stop-opacity=".45"/><stop offset="1" stop-color="#5dff8a" stop-opacity="0"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3ffe9"/><stop offset=".5" stop-color="#5dff8a"/><stop offset="1" stop-color="#0f8f42"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#eafff0"/><stop offset=".72" stop-color="#5dff8a"/><stop offset="1" stop-color="#11a64e"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <rect width="600" height="600" fill="url(#glow)"/>
