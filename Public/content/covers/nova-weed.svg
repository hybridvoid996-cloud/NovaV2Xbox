    <rect x="426" y="320" width="10" height="12"/><rect x="450" y="360" width="10" height="12"/><rect x="488" y="282" width="10" height="12"/><rect x="510" y="330" width="10" height="12"/><rect x="548" y="364" width="10" height="12"/><rect x="572" y="396" width="10" height="12"/>
  </g>
  <!-- street -->
  <path d="M0 520 L600 520 L600 600 L0 600Z" fill="#141816"/>
  <path d="M270 600 L290 520 M330 600 L310 520" stroke="#e8d36a" stroke-width="5" stroke-dasharray="18 14" opacity=".7"/>
  <!-- leaf mark -->
  <g transform="translate(300 215) scale(2.1)">
    <path d="M0-44c6 16 7 30 3 44 9-13 21-21 37-24-7 14-19 24-33 29 12-1 24 3 33 11-13 3-25 1-35-5 3 8 4 16 3 24l-3 9h-4l-1-9c-1-8 0-16 3-24-10 6-22 8-35 5 9-8 21-12 33-11C-10 0-22-10-29-24c16 3 28 11 37 24-4-14-3-28 3-44Z" fill="#5dff8a" opacity=".55" filter="url(#blur)"/>
    <path d="M0-44c6 16 7 30 3 44 9-13 21-21 37-24-7 14-19 24-33 29 12-1 24 3 33 11-13 3-25 1-35-5 3 8 4 16 3 24l-3 9h-4l-1-9c-1-8 0-16 3-24-10 6-22 8-35 5 9-8 21-12 33-11C-10 0-22-10-29-24c16 3 28 11 37 24-4-14-3-28 3-44Z" fill="url(#leaf)"/>
  </g>
  <!-- wordmark -->
  <g transform="translate(300 470) rotate(-5)">
    <text x="0" y="-92" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="26" letter-spacing="16" fill="#fff">NOVA</text>
    <text x="4" y="12" text-anchor="middle" font-family="Segoe UI,Arial Black,sans-serif" font-weight="900" font-style="italic" font-size="122" letter-spacing="-5" fill="#000" opacity=".5">WEED</text>
    <text x="0" y="4" text-anchor="middle" font-family="Segoe UI,Arial Black,sans-serif" font-weight="900" font-style="italic" font-size="122" letter-spacing="-5" fill="url(#word)" stroke="#031a0b" stroke-width="5" paint-order="stroke fill">WEED</text>
  </g>
  <g transform="translate(26 26)">
    <rect width="214" height="40" rx="20" fill="#000" fill-opacity=".55" stroke="#fff" stroke-opacity=".25"/>
    <path d="M26 8 29.5 17 38.5 20.5 29.5 24 26 33 22.5 24 13.5 20.5 22.5 17Z" fill="#fff"/>
