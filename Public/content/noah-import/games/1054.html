<!doctype html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/thirstygithub/postal2@8b9487aca31a558c5ed1eda7a161a64b361e4912/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POSTAL 2</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: monospace;
    }
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: #000000;
    }
    #overlay.hidden,
    #overlay[hidden] { display: none; }
    .track {
      width: 200px;
      height: 4px;
      background: #222222;
    }
    #fill {
      display: block;
      width: 0%;
      height: 100%;
      background: #ffffff;
      transition: width 0.1s linear;
    }
    #info {
      color: #ffffff;
      font-size: 12px;
      letter-spacing: 1px;
      min-height: 15px;
    }
    #status {
      color: #777777;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 340px;
      min-height: 12px;
    }
    .credit {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 10000;
      color: #555555;
      font-size: 10px;
      letter-spacing: 0.5px;
      pointer-events: none;
      user-select: none;
    }
    #canvas { display: block; }
    #canvas[hidden] { display: none; }
    #hud[hidden] { display: none; }
    #hud {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 10000;
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
    }
    #hud button {
      border: 1px solid #333333;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
    }
    #fps {
      display: none;
      border: 1px solid #333333;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px;
    }
  </style>
</head>
<body>
  <main id="overlay">
    <div class="track"><span id="fill"></span></div>
    <div id="info">starting…</div>
    <div id="status" role="status"></div>
    <button id="play" type="button" hidden>play</button>
  </main>
  <div class="credit">credit to corbins for the port</div>
  <canvas id="canvas" width="1280" height="720" tabindex="0" hidden></canvas>
  <div id="hud" hidden>
    <span id="fps"></span>
    <button id="bsound">Sound: on</button>
    <button id="bfps">FPS</button>
    <button id="bcap">Cap: 60</button>
    <button id="bvsync">Vsync: off</button>
    <button id="bfull">Fullscreen</button>
  </div>
  <script src="postal2-data.js?v=896efe0b8ab1" data-chunks-base="https://cdn.jsdelivr.net/gh/web-ports/postal-2@master/chunks/" data-runtime-base="https://cdn.jsdelivr.net/gh/thirstygithub/postal2@8b9487aca31a558c5ed1eda7a161a64b361e4912/runtime/"></script>
  <script src="postal2.js"></script>
  <script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), status = s => { $('status').textContent = s; };
  const q = new URLSearchParams(location.search);
                                                                                                 
                                                                             
  const GAME_BASE = '';
                                                                               
  try { for (const k of ['Vsync', 'Progs']) { const v = localStorage.getItem('sa' + k); if (v !== null) { if (localStorage.getItem('rxc' + k) === null) localStorage.setItem('rxc' + k, v); localStorage.removeItem('sa' + k); } } } catch (e) {}
  if (!('Suspending' in WebAssembly)) { status('This browser lacks WebAssembly JavaScript Promise Integration: use Chrome or Edge 137 or newer.'); $('play').disabled = true; }
  let GAME_W = 1280, GAME_H = 720;                                                                                             

                                                                            
  const K = {};
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((ch, i) => { K['Key' + ch] = [65 + i, [0x1E,0x30,0x2E,0x20,0x12,0x21,0x22,0x23,0x17,0x24,0x25,0x26,0x32,0x31,0x18,0x19,0x10,0x13,0x1F,0x14,0x16,0x2F,0x11,0x2D,0x15,0x2C][i], 0]; });
  for (let d = 0; d <= 9; d++) K['Digit' + d] = [48 + d, d === 0 ? 0x0B : d + 1, 0];
  Object.assign(K, { Escape: [0x1B, 0x01, 0], Minus: [0xBD, 0x0C, 0], Equal: [0xBB, 0x0D, 0], Backspace: [0x08, 0x0E, 0], Tab: [0x09, 0x0F, 0], BracketLeft: [0xDB, 0x1A, 0], BracketRight: [0xDD, 0x1B, 0],
    Enter: [0x0D, 0x1C, 0], ControlLeft: [0x11, 0x1D, 0], Semicolon: [0xBA, 0x27, 0], Quote: [0xDE, 0x28, 0], Backquote: [0xC0, 0x29, 0], ShiftLeft: [0x10, 0x2A, 0], Backslash: [0xDC, 0x2B, 0],
    Comma: [0xBC, 0x33, 0], Period: [0xBE, 0x34, 0], Slash: [0xBF, 0x35, 0], ShiftRight: [0x10, 0x36, 0], NumpadMultiply: [0x6A, 0x37, 0], AltLeft: [0x12, 0x38, 0], Space: [0x20, 0x39, 0],
    CapsLock: [0x14, 0x3A, 0], F1: [0x70, 0x3B, 0], F2: [0x71, 0x3C, 0], F3: [0x72, 0x3D, 0], F4: [0x73, 0x3E, 0], F5: [0x74, 0x3F, 0], F6: [0x75, 0x40, 0], F7: [0x76, 0x41, 0], F10: [0x79, 0x44, 0],
    F12: [0x7B, 0x58, 0], Numpad7: [0x67, 0x47, 0], Numpad8: [0x68, 0x48, 0], Numpad9: [0x69, 0x49, 0], NumpadSubtract: [0x6D, 0x4A, 0], Numpad4: [0x64, 0x4B, 0], Numpad5: [0x65, 0x4C, 0],
    Numpad6: [0x66, 0x4D, 0], NumpadAdd: [0x6B, 0x4E, 0], Numpad1: [0x61, 0x4F, 0], Numpad2: [0x62, 0x50, 0], Numpad3: [0x63, 0x51, 0], Numpad0: [0x60, 0x52, 0], NumpadDecimal: [0x6E, 0x53, 0],
    NumpadEnter: [0x0D, 0x1C, 1], ControlRight: [0x11, 0x1D, 1], AltRight: [0x12, 0x38, 1], ArrowUp: [0x26, 0x48, 1], ArrowLeft: [0x25, 0x4B, 1], ArrowRight: [0x27, 0x4D, 1], ArrowDown: [0x28, 0x50, 1],
    Insert: [0x2D, 0x52, 1], Delete: [0x2E, 0x53, 1], Home: [0x24, 0x47, 1], End: [0x23, 0x4F, 1], PageUp: [0x21, 0x49, 1], PageDown: [0x22, 0x51, 1] });

  let M = null, started = false;
                                                                                                                       
                                                                                        
  let transferred = false;
  const fit = () => { const w = GAME_W, h = GAME_H;
    if (M) { M.canvasW = w; M.canvasH = h; } if (!transferred && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; } };
  addEventListener('resize', fit); fit();
  $('bfps').onclick = () => { const f = $('fps'); f.style.display = f.style.display === 'inline' ? 'none' : 'inline'; };
  $('bfull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
  const setVsync = on => { if (M) M.vsync = on; localStorage.setItem('rxcVsync', on ? '1' : '0'); $('bvsync').textContent = 'Vsync: ' + (on ? 'on' : 'off'); };
  $('bvsync').onclick = () => { setVsync(localStorage.getItem('rxcVsync') !== '1'); alert('Reload the page to apply.'); };
  setVsync(localStorage.getItem('rxcVsync') === '1');
                                                                                                 
  const CAPS = [60, 120, 0, 30], capName = c => c ? String(c) : 'max';
  let cap = +(q.get('REXCOMP_FPS') ?? localStorage.getItem('rxcCap') ?? 60); if (!CAPS.includes(cap)) cap = 60;
  const showCap = () => { $('bcap').textContent = 'Cap: ' + capName(cap); };
  $('bcap').onclick = () => { cap = CAPS[(CAPS.indexOf(cap) + 1) % CAPS.length]; localStorage.setItem('rxcCap', String(cap)); showCap(); if (M && M._rxc_ev_fps) M._rxc_ev_fps(cap); };
  showCap();
  for (const b of document.querySelectorAll('#hud button')) { b.tabIndex = -1; b.addEventListener('mousedown', e => e.preventDefault()); b.addEventListener('click', () => { b.blur(); canvas.focus(); }); }

                                                            
  const ev = (name, ...a) => { if (M && M['_' + name]) M['_' + name](...a); };
                                                                                                           
  const pos = e => { const r = canvas.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) * GAME_W / r.width), Math.round((e.clientY - r.top) * GAME_H / r.height)]; };
  addEventListener('keydown', e => {
    if (!started) return;
    if (e.code === 'F8') { $('bfps').onclick(); e.preventDefault(); return; }
    if (e.code === 'F11') { $('bfull').onclick(); e.preventDefault(); return; }
    const k = K[e.code]; if (!k) return;
    ev('rxc_ev_key', 1, k[0], k[1], (e.repeat ? 1 : 0) | (k[2] ? 2 : 0));
    if (e.key.length === 1 && !e.ctrlKey && !e.altKey) ev('rxc_ev_char', e.key.charCodeAt(0));
    else if (e.code === 'Enter' || e.code === 'Backspace' || e.code === 'Escape') ev('rxc_ev_char', k[0]);
    e.preventDefault();
  });
  addEventListener('keyup', e => { if (!started) return; const k = K[e.code]; if (!k) return; ev('rxc_ev_key', 0, k[0], k[1], k[2] ? 2 : 0); e.preventDefault(); });
                                                                                                                       
                  
  let mouseDown = false;
  const tid = e => (e.pointerId % 1000000) + 2;
  canvas.addEventListener('pointerdown', e => {
    canvas.focus(); e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') { mouseDown = true; ev('rxc_ev_mouse', 0, x, y, 0, 0); ev('rxc_ev_mouse', 1, x, y, e.button, 0); }
    else ev('rxc_ev_touch', 0, tid(e), x, y);
  });
  canvas.addEventListener('pointermove', e => {
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') ev('rxc_ev_mouse', 0, x, y, 0, 0); else ev('rxc_ev_touch', 1, tid(e), x, y);
  });
  const up = e => {
    const [x, y] = pos(e);
    if (e.pointerType === 'mouse') { if (mouseDown) { mouseDown = false; ev('rxc_ev_mouse', 2, x, y, e.button, 0); } }
    else ev('rxc_ev_touch', 2, tid(e), x, y);
  };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('focus', () => ev('rxc_ev_focus', 1)); addEventListener('blur', () => ev('rxc_ev_focus', 0));
  canvas.addEventListener('webglcontextlost', () => { status('The graphics context was lost (GPU reset). Reload the page to continue.'); $('overlay').classList.remove('hidden'); $('overlay').hidden = false; canvas.hidden = true; document.body.removeAttribute('style'); });

                                                                                                         
  const WORKLET = `class RexcompOut extends AudioWorkletProcessor {
    constructor() { super(); this.q = []; this.off = 0; this.queued = 0;
      this.port.onmessage = e => { this.q.push(e.data); this.queued += e.data.length / 2;
        while (this.queued > sampleRate * 0.2 && this.q.length > 1) { const b = this.q.shift(); this.queued -= b.length / 2 - this.off; this.off = 0; } }; }
    process(inputs, outputs) { const out = outputs[0], L = out[0], R = out[1] || out[0], n = L.length; let i = 0;
      while (i < n && this.q.length) { const b = this.q[0], frames = b.length / 2, take = Math.min(n - i, frames - this.off);
        for (let k = 0; k < take; k++) { L[i + k] = b[(this.off + k) * 2]; R[i + k] = b[(this.off + k) * 2 + 1]; }
        i += take; this.off += take; this.queued -= take; if (this.off >= frames) { this.q.shift(); this.off = 0; } }
      for (; i < n; i++) { L[i] = 0; R[i] = 0; }
      return true; } }
  registerProcessor('rexcomp-out', RexcompOut);`;
  async function startAudio(M) {
    try {
      const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
      const node = new AudioWorkletNode(ctx, 'rexcomp-out', { numberOfInputs: 0, outputChannelCount: [2] });
      node.connect(ctx.destination); M.audioContext = ctx; M.audioNode = node;
      $('bsound').onclick = () => { const on = ctx.state !== 'running'; if (on) ctx.resume(); else ctx.suspend(); $('bsound').textContent = on ? 'Sound: on' : 'Sound: off'; };
    } catch (e) { console.warn('[audio] unavailable:', e); $('bsound').textContent = 'Sound: n/a'; }
  }

  $('play').onclick = async () => {
    if (started) return; started = true;
    $('play').disabled = true; status('Loading…');
    M = {
      canvas, vsync: localStorage.getItem('rxcVsync') === '1' || q.has('vsync'),
      preRun: [m => { m.ENV.REXCOMP_FPS = String(cap); m.ENV.REXCOMP_ARGS = '-nosteam -windowed -nosplash'; for (const [k, v] of q) if (k.startsWith('REXCOMP_')) m.ENV[k] = v; }],                                             
      print: s => console.log(s), printErr: s => console.error(s),
      onStatus: s => status(s),
      onMenuCursor: (visible, x, y) => window.postal2MenuCursor?.(visible, x, y),
      onFps: f => { $('fps').textContent = f.toFixed(0) + ' fps'; },
      onGameSize: (w, h) => { GAME_W = w; GAME_H = h; fit(); },
      onFirstFrame: () => { $('overlay').classList.add('hidden'); $('overlay').hidden = true;
      canvas.hidden = false;
      Object.assign(canvas.style, {position:'fixed', inset:'0', width:'100vw', height:'100vh', objectFit:'fill'});
      document.body.style.margin = '0'; document.body.style.overflow = 'hidden'; canvas.focus(); },
    };
    M.saveNamespace = 'rexcomp-postal2'; window.rexcomp = M; fit(); if (q.has('glahead')) M.glAhead = +q.get('glahead');
                                                                                                                            
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => console.log('[web] persistent storage: ' + ok)); } catch (e) {}
                                                                                                                              
    const GL_WORKER = false;                                     
    if (GL_WORKER) try {
      const probe = document.createElement('canvas').getContext('webgl2');
      if (probe) { M.glExtensions = probe.getSupportedExtensions().join(' '); const ax = probe.getExtension('EXT_texture_filter_anisotropic'); M.glMaxAniso = ax ? probe.getParameter(ax.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1; const le = probe.getExtension('WEBGL_lose_context'); if (le) le.loseContext(); }
      const off = canvas.transferControlToOffscreen(); transferred = true;
      M.glWorker = new Worker('postal2-renderer.js');
      M.glWorker.postMessage({ init: true, canvas: off, preserve: q.has('preserve') }, [off]);
    } catch (e) { status('This browser cannot run WebGL in a worker: ' + e); console.error(e); return; }
                                                                                                        
    M.gameBase = GAME_BASE; M.dataFetch = window.postal2DataFetch;
    M.programList = (await fetch('postal2-programs.txt').then(r => r.ok ? r.text() : '').catch(() => '')) + (localStorage.getItem('rxcProgs') || '');
    await startAudio(M);                                                                                    
    Rexcomp(M).catch(e => { status('Failed to start: ' + e); console.error(e); });
    canvas.focus();
  };
  if (q.has('autostart')) $('play').onclick();
})();

  </script>
  <script src="postal2-controls.js"></script>
  <script>
  (function () {
    var overlay = document.getElementById('overlay');
    var fill = document.getElementById('fill');
    var info = document.getElementById('info');
    var status = document.getElementById('status');
    var original = window.postal2DataFetch;

    var total = 0;
    var loaded = 0;
    var began = performance.now();
    var engineTimer = null;
    var finishing = false;

    function mb(bytes) {
      return (bytes / 1048576).toFixed(0);
    }

    function setBar(percent) {
      fill.style.width = Math.max(0, Math.min(100, percent)).toFixed(1) + '%';
    }

    function show(percent, extra) {
      setBar(percent);
      info.textContent = Math.round(Math.max(0, Math.min(100, percent))) + '%' + (extra ? '   ' + extra : '');
    }

    function paintDownload() {
      var ratio = total ? Math.min(1, loaded / total) : 0;
      var extra = mb(loaded) + (total ? ' / ' + mb(total) + ' MB' : ' MB');
      if (ratio >= 1) {
        show(90);
        startEngine();
        return;
      }
      var elapsed = (performance.now() - began) / 1000;
      if (elapsed > 1.5 && loaded > 1024 && total) {
        var left = Math.max(0, (total - loaded) / (loaded / elapsed));
        if (left > 1) extra += '   ~' + Math.ceil(left) + 's left';
      }
      show(ratio * 90, extra);
    }

    function startEngine() {
      if (engineTimer || finishing) return;
      setTimeout(function () {
        alert('Heads up, this game takes around 6-8 minutes to load once it says "starting...". ' +
              'Be patient, it works.');
      }, 50);
      var start = performance.now();
      engineTimer = setInterval(function () {
        var seconds = (performance.now() - start) / 1000;
        show(90 + 9 * (1 - Math.exp(-seconds / 10)));
      }, 150);
    }

    function finish() {
      if (finishing) return;
      finishing = true;
      if (engineTimer) clearInterval(engineTimer);
      setBar(100);
    }

    new MutationObserver(function () {
      if (overlay.hidden || overlay.classList.contains('hidden')) finish();
    }).observe(overlay, { attributes: true, attributeFilter: ['hidden', 'class'] });

    if (original) {
      window.postal2DataFetch = function (input, init) {
        var name = '';
        try {
          var url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url, location.href);
          name = url.pathname.slice(url.pathname.lastIndexOf('/') + 1);
        } catch (error) {
          name = '';
        }
        var result = original.apply(this, arguments);
        if (name !== 'postal2.wasm' && name !== 'postal2-image.bin') return result;
        return result.then(function (response) {
          if (!response.body) return response;
          var reader = response.body.getReader();
          var stream = new ReadableStream({
            pull: function (controller) {
              return reader.read().then(function (step) {
                if (step.done) {
                  controller.close();
                  return;
                }
                loaded += step.value.length;
                paintDownload();
                controller.enqueue(step.value);
              });
            }
          });
          return new Response(stream, {
            status: response.status,
            statusText: response.statusText,
            headers: response.headers
          });
        });
      };
    }

    var tag = document.querySelector('script[data-runtime-base]');
    var runtimeBase = tag ? tag.dataset.runtimeBase : '';
    if (runtimeBase) {
      fetch(new URL('manifest.json', runtimeBase).href)
        .then(function (response) { return response.ok ? response.json() : null; })
        .then(function (data) {
          if (!data || !data.files) return;
          var wasm = data.files['postal2.wasm'];
          var image = data.files['postal2-image.bin'];
          total = (wasm ? wasm.size : 0) + (image ? image.size : 0);
          if (!loaded) show(0, '0 / ' + mb(total) + ' MB');
        })
        .catch(function () {});
    }

    addEventListener('pointerdown', function resume() {
      try {
        if (window.rexcomp && window.rexcomp.audioContext && window.rexcomp.audioContext.state === 'suspended') {
          window.rexcomp.audioContext.resume();
        }
      } catch (error) {
      }
    }, { once: false });

    addEventListener('load', function () {
      var play = document.getElementById('play');
      if (play) play.click();
    });
  })();
  </script>
</body>
</html>
