<body><div style="position:fixed;inset:0;z-index:9999;background:#090b10;color:white;display:grid;place-content:center;text-align:center;font-family:system-ui"><h1>Pokemon Academy Life Forever</h1><p>Downloads start only when you play.</p><button id="novaStart" style="padding:16px;border-radius:30px;cursor:pointer">Play</button></div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  <div id="overlayDiv"></div>

  <img id="presplash" src="https://cdn.jsdelivr.net/gh/bubbls/ports@main/Pokemon-Academy-Life-Forever/web-presplash.jpg">

  <div id="ContextContainer">
    <a id="ContextButton">&#8801;</a><br />
    <div id="ContextMenu" style="display: none;">
      <input id="ID_SavegamesImport" type="file" onchange="onSavegamesImport(this)" accept="application/zip"
        style=display:none></input>
      <a href="javascript:document.getElementById('ID_SavegamesImport').click();">Import Saves</a>
      <a href="javascript:onSavegamesExport();">Export Saves</a>
      <a href="javascript:FSDownload('/log.txt', 'text/plain');">Download Log</a>
      <a href="https://www.renpy.org/" target="_blank">
          Powered by Ren'Py
      </a>
      </span>
    </div>
  </div>

  <div id="statusDiv" class="hidden">
    <div id="statusTextDiv"></div>
    <progress id="statusProgress" value="0" max="100"></progress>
  </div>

  <div id="inputDiv" class="hidden">
    <form id="inputForm">
      <div id="inputPrompt"></div>
      <input id="inputText" type="text">
    </form>
  </div>

  <script>
    function mergeFiles(fileParts) {
        return new Promise((resolve, reject) => {
            let buffers = [];
            function fetchPart(index) {
                if (index >= fileParts.length) {
                    let mergedBlob = new Blob(buffers);
                    let mergedFileUrl = URL.createObjectURL(mergedBlob);
                    resolve(mergedFileUrl);
                    return;
                }
                fetch(fileParts[index]).then((response) => {if (!response.ok) throw Error("Game file unavailable"); return response.arrayBuffer();}).then((data) => {
                    buffers.push(data);
                    fetchPart(index + 1);
                }).catch(reject);
            }
            fetchPart(0);
        });
    }
    function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
            parts.push("https://nova-content.invalid/content/pokemon-space/academy/" + file + ".part" + i);
        }
        return parts;
    }
    async function mergeWasmParts() {
        const parts = ['renpy.wasm.part1', 'renpy.wasm.part2'].map(file => 'https://nova-content.invalid/content/pokemon-space/academy/' + file);
        
        const responses = await Promise.all(
            parts.map(part => fetch(part).then(r => { if (!r.ok) throw Error("Game file unavailable"); return r; }))
        );
      
        const buffers = await Promise.all(
            responses.map(r => r.arrayBuffer())
        );
        
        const mergedBlob = new Blob(buffers, {type: "application/wasm"});
        return URL.createObjectURL(mergedBlob);
    }
    document.getElementById("novaStart").onclick = function() { this.parentElement.remove(); mergeWasmParts().then(wasmUrl => {
        window.wasmBinaryFile = wasmUrl;
        
        return mergeFiles(getParts("game.zip", 1, 2));
    }).then(gameZipURL => {
        window.gameZipURL = gameZipURL;
        let renpypre = document.createElement("script");
        renpypre.src = "https://nova-content.invalid/content/pokemon-space/academy/renpy-pre.js?v=137b";  
        renpypre.onload = function() {
            let renpy = document.createElement("script");
            renpy.src = "https://nova-content.invalid/content/pokemon-space/academy/renpy.js";  
            document.body.appendChild(renpy);
        };
        
        document.body.appendChild(renpypre);
    }).catch(error => {
        document.body.insertAdjacentHTML("beforeend", '<div style="position:fixed;inset:0;background:#101219;color:white;z-index:9999;padding:40px">Game files could not load. <button onclick="location.reload()">Retry</button></div>');
    }); };
</script>
