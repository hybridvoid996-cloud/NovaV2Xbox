<script>
const loadingText = document.querySelector("#loading-text");
let loadedBytes = 0;
const DB_NAME = "gameFilesDB";
const STORE_NAME = "files";

// Open or create IndexedDB
function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };
        request.onsuccess = e => resolve(e.target.result);
        request.onblocked = () => reject(new Error("Game cache is unavailable"));
        request.onerror = e => reject(e.target.error);
    });
}

// Save file to IndexedDB
async function saveFile(name, buffer) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put(buffer, name);
        tx.oncomplete = () => {db.close();resolve();};
        tx.onabort = tx.onerror = e => {db.close();reject(e.target.error||new Error("Game cache failed"));};
    });
}

// Get file from IndexedDB
async function getFile(name) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(name);
        request.onsuccess = e => {db.close();resolve(e.target.result);};
        request.onerror = e => {db.close();reject(e.target.error);};
    });
}

// Cache is an optimization; storage restrictions must never block gameplay.
let assetCacheAvailable=true;
let startupFailed=false;const activeDownloads=new Set();
const assetRevision='796678be4ed26a13c1256be98781ca9b90beb981';
const assetMirrors=[
 'https://cdn.jsdelivr.net/gh/web-ports/vice-city@'+assetRevision+'/',
 'https://fastly.jsdelivr.net/gh/web-ports/vice-city@'+assetRevision+'/',
 'https://gcore.jsdelivr.net/gh/web-ports/vice-city@'+assetRevision+'/'
];
async function fetchWithCache(name,url){
 const key=assetRevision+'/'+name;
 const optionalCache=async promise=>{let timer;try{return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error("Game cache timed out")),4000)})])}finally{clearTimeout(timer)}};
 if(assetCacheAvailable){try{const cached=await optionalCache(getFile(key));if(cached instanceof ArrayBuffer&&cached.byteLength)return cached}catch{assetCacheAvailable=false}}
 let error;
 for(let attempt=0;attempt<assetMirrors.length;attempt++){
  if(startupFailed)throw Error("Game startup cancelled");
  const controller=new AbortController();activeDownloads.add(controller);let timer;
  const arm=()=>{clearTimeout(timer);timer=setTimeout(()=>controller.abort(),30000)};
  let received=0;
  try{
   arm();const response=await fetch(new URL(url,assetMirrors[attempt]).href,{signal:controller.signal});
   if(!response.ok||/text\/html/i.test(response.headers.get('content-type')||''))throw Error('Game asset returned '+response.status);
   const expected=response.headers.get('content-encoding')?0:Number(response.headers.get('content-length'))||0,reader=response.body.getReader(),chunks=[];
   while(true){const next=await reader.read();arm();if(next.done)break;received+=next.value.length;loadedBytes+=next.value.length;chunks.push(next.value);if(!startupFailed)loadingText.textContent='Downloading Vice City · '+(loadedBytes/1048576).toFixed(1)+' MB · '+name;}
   if(!received||(expected&&received!==expected))throw Error('Incomplete game asset');
   const result=new Uint8Array(received);let offset=0;for(const chunk of chunks){result.set(chunk,offset);offset+=chunk.length}
   chunks.length=0;
   if(assetCacheAvailable){try{await optionalCache(saveFile(key,result.buffer))}catch{assetCacheAvailable=false}}
   return result.buffer;
  }catch(e){loadedBytes-=received;error=e;if(!startupFailed)loadingText.textContent='Reconnecting game download · '+name+' · attempt '+(attempt+1)+' of '+assetMirrors.length;}
  finally{clearTimeout(timer);activeDownloads.delete(controller)}
 }
 throw Error('Could not download '+name+': '+(error?.message||'connection failed'));
}

// Pinned Nova copies first; still requested through the game proxy.
async function loadRuntimeScript(name){
 if(!['idbfs.js','game.js'].includes(name))throw Error('Unknown Vice City runtime');
 const sources=['https://nova-content.invalid/content/runtime/vice-city/'+name+'?v=20261029-403',...assetMirrors.map(base=>new URL(name,base).href)];
 for(const src of sources){
  if(startupFailed)throw Error('Game startup cancelled');
  try{await new Promise((resolve,reject)=>{const script=document.createElement('script');let timer;const finish=error=>{clearTimeout(timer);script.onload=script.onerror=null;if(error){script.remove();reject(error)}else resolve()};script.async=false;script.src=src;script.onload=()=>finish();script.onerror=()=>finish(Error('Could not load '+name));timer=setTimeout(()=>finish(Error('Timed out loading '+name)),20000);document.body.appendChild(script)});return}catch(error){if(!startupFailed)loadingText.textContent='Reconnecting Vice City runtime · '+name;}
 }
 throw Error('Could not load '+name+' from Nova or its backup sources');
}

// Merge multiple parts
async function mergeFiles(fileParts, namePrefix) {
    const buffers = [];
    for (let i = 0; i < fileParts.length; i++) {
        const buffer = await fetchWithCache(`${namePrefix}.part${i+1}`, fileParts[i]);
        buffers.push(buffer);
    }
    const mergedBlob = new Blob(buffers);
    return URL.createObjectURL(mergedBlob);
}

// Generate part URLs
function getParts(file, start, end) {
    let parts = [];
    for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
    }
    return parts;
}

// Start fetching and caching
Promise.all([
    mergeFiles(getParts("index.data", 1, 7), "index.data"),
    mergeFiles(getParts("audio/emotion.adf", 1, 3), "emotion.adf"),
    mergeFiles(getParts("audio/espant.adf", 1, 3), "espant.adf"),
    mergeFiles(getParts("audio/fever.adf", 1, 3), "fever.adf"),
    mergeFiles(getParts("audio/flash.adf", 1, 3), "flash.adf"),
    mergeFiles(getParts("audio/kchat.adf", 1, 3), "kchat.adf"),
    mergeFiles(getParts("audio/vcpr.adf", 1, 2), "vcpr.adf"),
    mergeFiles(getParts("audio/vrock.adf", 1, 4), "vrock.adf"),
    mergeFiles(getParts("audio/wave.adf", 1, 4), "wave.adf"),
    mergeFiles(getParts("audio/wild.adf", 1, 4), "wild.adf"),
]).then(async ([indexdataurl, EMOTIONadfurl, ESPANTadfurl, FEVERadfurl, FLASHadfurl, KCHATadfurl, VCPRadfurl, VROCKadfurl, WAVEadfurl, WILDadfurl]) => {
    
    // Override fetch to use cached URLs
    const originalFetch = window.fetch;
    window.fetch = async function(input, init) {
        let urlString = input instanceof Request ? input.url : String(input);

        if (urlString.toLowerCase().includes("index.data".toLowerCase())) input = indexdataurl;
        else if (urlString.toLowerCase().includes("emotion.adf".toLowerCase())) input = EMOTIONadfurl;
        else if (urlString.toLowerCase().includes("espant.adf".toLowerCase())) input = ESPANTadfurl;
        else if (urlString.toLowerCase().includes("fever.adf".toLowerCase())) input = FEVERadfurl;
        else if (urlString.toLowerCase().includes("flash.adf".toLowerCase())) input = FLASHadfurl;
        else if (urlString.toLowerCase().includes("kchat.adf".toLowerCase())) input = KCHATadfurl;
        else if (urlString.toLowerCase().includes("VCPR.adf".toLowerCase())) input = VCPRadfurl;
        else if (urlString.toLowerCase().includes("VROCK.adf".toLowerCase())) input = VROCKadfurl;
        else if (urlString.toLowerCase().includes("WAVE.adf".toLowerCase())) input = WAVEadfurl;
        else if (urlString.toLowerCase().includes("WILD.adf".toLowerCase())) input = WILDadfurl;

        return originalFetch(input, init);
    };

    // Similarly override XHR
    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        if (url.includes("https://cdn.dos.zone/vcsky/fetched/".toLowerCase())) url = url.replace("https://cdn.dos.zone/vcsky/fetched/", "")
        if (url.toLowerCase().includes("index.data".toLowerCase())) url = indexdataurl;
        else if (url.toLowerCase().includes("emotion.adf".toLowerCase())) url = EMOTIONadfurl;
        else if (url.toLowerCase().includes("espant.adf".toLowerCase())) url = ESPANTadfurl;
        else if (url.toLowerCase().includes("fever.adf".toLowerCase())) url = FEVERadfurl;
        else if (url.toLowerCase().includes("flash.adf".toLowerCase())) url = FLASHadfurl;
        else if (url.toLowerCase().includes("KCHAT.adf".toLowerCase())) url = KCHATadfurl;
        else if (url.toLowerCase().includes("VCPR.adf".toLowerCase())) url = VCPRadfurl;
        else if (url.toLowerCase().includes("VROCK.adf".toLowerCase())) url = VROCKadfurl;
        else if (url.toLowerCase().includes("WAVE.adf".toLowerCase())) url = WAVEadfurl;
        else if (url.toLowerCase().includes("WILD.adf".toLowerCase())) url = WILDadfurl;
        return originalOpen.call(this, method, url, ...rest);
    };

    // The port's gamepademulator.js link is missing. Load the maintained,
    // pinned controller library before the runtime can call GamepadEmulator.
    const gamepadSupport=await import('https://cdn.jsdelivr.net/npm/virtual-gamepad-lib@0.3.3/GamepadEmulator.js');
    window.GamepadEmulator=gamepadSupport.GamepadEmulator;
    // Load in order; script errors must be visible instead of a blank canvas.
    await loadRuntimeScript('idbfs.js');
    await loadRuntimeScript('game.js');

    loadingText.remove();
}).catch(error=>{startupFailed=true;for(const controller of activeDownloads)controller.abort();loadingText.textContent="Vice City download stopped: "+error.message+". Reload to retry.";console.error("Vice City startup:",error);});
</script>
