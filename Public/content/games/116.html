<!DOCTYPE html>
<html lang="en-us">
  <head><script src="/src/game-audio-inject.js"></script><script id="nova-analytics-compat">window.dataLayer=window.dataLayer||[];window.gtag=window.gtag||function(){};</script>
    
    
    
    <base href="https://cdn.jsdelivr.net/gh/freebuisness/assets@main/116/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MX OffRoad Mountain Bike</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#unity-container{position:fixed;inset:0;transform:none;width:100%;height:100%}#unity-canvas{width:100%;height:100%}

</style>
</head>
  <body class="light">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
      const hideFullScreenButton = "1";
      const buildUrl = "Build";
      const loaderUrl = new URL("/content/runtime/bike-native.loader.js", location.href).href;
      const config = {
        devicePixelRatio: Math.min(devicePixelRatio || 1, 1.5),
        dataUrl: "https://raw.githubusercontent.com/freebuisness/assets/main/116/Build/bike.data.unityweb",
        frameworkUrl: buildUrl + "/bike.framework.js.unityweb",
        codeUrl: buildUrl + "/bike.wasm.unityweb",
        streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/116/StreamingAssets",
        companyName: "RHM",
        productName: "MX OffRoad Mountain Bike",
        productVersion: "1",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }
      canvas.style.background = "url('" + buildUrl + "/bike.jpg') center / cover";
      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = () => { spinner.style.display = "none"; loadingCover.appendChild(Object.assign(document.createElement("p"),{textContent:"Game loader could not download. Refresh to retry."})); };
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingCover.style.display = "none";
          if (canFullscreen) {
            if (!hideFullScreenButton) {
              fullscreenButton.style.display = "";
            }
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  
</body>
</html>
