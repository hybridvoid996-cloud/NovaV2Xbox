        <script>
            function mergeFiles(fileParts) {
                return new Promise((resolve, reject) => {
                    let buffers = [];
    
                    function fetchPart(index) {
                        if (index >= fileParts.length) {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                            return;
                        }
                        fetch(fileParts[index]).then((response) => {
                            if (!response.ok) throw Error('Game archive returned HTTP ' + response.status);
                            return response.arrayBuffer();
                        }).then((data) => {
                            if (data.byteLength !== 14194460) throw Error('Game archive part is incomplete.');
                            buffers.push(data);
                            fetchPart(index + 1);
                        }).catch(reject);
                    }
                    fetchPart(0);
                });
            }
    
            function getParts(file, start, end) {
                let parts = [];
                for (let i = start; i <= end; i++) {
                    parts.push(file + ".part" + i);
                }
                return parts;
            }
            mergeFiles(getParts("game.zip", 1, 2)).then(async url => {
                window.gameZipUrl = url;
                let renpypre = document.createElement("script");
                renpypre.src = "https://cdn.jsdelivr.net/gh/giorgirick2-gif/game-webports-onawebsite@b3042ae7a56b2ede39ea4b4371b1d0ab3af8828a/class-of-09/renpy-pre.js"
                let renpy = document.createElement("script");
                renpy.src = "https://cdn.jsdelivr.net/gh/giorgirick2-gif/game-webports-onawebsite@b3042ae7a56b2ede39ea4b4371b1d0ab3af8828a/class-of-09/renpy.js"
                await new Promise((resolve, reject) => {
                    renpypre.onload = resolve;
                    renpypre.onerror = () => reject(Error('The game bootstrap could not load.'));
                    document.body.appendChild(renpypre);
                });
                await new Promise((resolve, reject) => {
                    renpy.onload = resolve;
                    renpy.onerror = () => reject(Error('The game engine could not load.'));
                    document.body.appendChild(renpy);
                });
            }).catch(error => {
                const message = document.createElement('p');
                message.setAttribute('role', 'alert');
                message.style.cssText = 'position:fixed;inset:40% 10% auto;z-index:100;color:white;background:#17171d;padding:24px;text-align:center';
                message.textContent = 'Game files could not load. ' + error.message;
                document.body.appendChild(message);
            });
            addEventListener('pagehide', () => { if (window.gameZipUrl) URL.revokeObjectURL(window.gameZipUrl); }, {once:true});
        </script>
