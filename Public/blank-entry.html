<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading about:blank</title>
<style>html{color-scheme:dark;background:#08090b;color:#eee;font:14px system-ui}body{min-height:90vh;display:grid;place-content:center;text-align:center}button{padding:14px 24px;border-radius:14px;border:1px solid #ffffff30;background:#ffffff12;color:inherit;cursor:pointer}</style>
<body><p>Loading about:blank…</p><button hidden>Open Nova</button>
<script type="module">
import {launchBlank} from '/src/blank-tab.mjs';
const target=new URL('/home.html'+location.search,location.origin);
function start(){if(launchBlank({url:target.href})){location.replace('about:blank');return true}return false}
if(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)){target.searchParams.set('nova-regular','1');location.replace(target.href)}else if(!start()){const button=document.querySelector('button');button.hidden=false;button.onclick=start;document.querySelector('p').textContent='Open Nova in about:blank to continue.'}
</script></body></html>
