<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova · Phone preview</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24252b,#09090c 65%);color:#eee;font:14px system-ui;min-height:100vh;padding:24px;text-align:center}h1{font-size:24px;margin:0 0 6px}p{color:#a7a7b2;margin:0 0 18px}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:20px}button{border:1px solid #ffffff26;background:#ffffff09;color:#eee;border-radius:12px;padding:10px 16px;cursor:pointer;transition:background .2s,transform .2s}button:hover{background:#ffffff20;transform:translateY(-2px)}button[aria-pressed=true]{background:#eee;color:#111}.device{width:414px;max-width:100%;margin:auto;border:1px solid #ffffff35;border-radius:38px;padding:11px;background:#080809;box-shadow:0 25px 80px #0008;transition:width .35s}.device.landscape{width:868px}.device iframe{display:block;width:100%;height:min(844px,calc(100dvh - 210px));border:0;border-radius:28px;background:#101015}.device.landscape iframe{height:390px}.note{font-size:12px;margin-top:18px}a{color:#ddd}@media(max-width:450px){body{padding:12px}.device{padding:5px;border-radius:25px}.device iframe{height:78vh;border-radius:20px}}</style></head><body><h1>Nova on your phone</h1><p>Try the real pages inside a phone-sized screen.</p><nav><button data-url="nova-phone-preview.html" aria-pressed="true">Home</button><button data-url="player.html?kind=game&id=1044">Game player</button><button data-url="novamovies.html">Movies</button><button data-url="music.html">Music</button><button id="rotate">↻ Landscape</button></nav><div class="device"><iframe title="Nova phone preview" src="nova-phone-preview.html" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></div><p class="note">Game player opens Minecraft’s version selection. Movies opens the catalog; choose a title to try playback.<br>This previews screen layout, not a physical phone’s speed or browser compatibility.</p><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>{frame.src=b.dataset.url;document.querySelectorAll('[data-url]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.querySelector('#rotate').onclick=()=>{const on=document.querySelector('.device').classList.toggle('landscape');document.querySelector('#rotate').textContent=on?'↻ Portrait':'↻ Landscape'};</script></body></html>
