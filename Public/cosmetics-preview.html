<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova · Cosmetic Studio</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#41414c45,transparent 55%),radial-gradient(ellipse at 90% 80%,#5b4d6920,transparent 55%),#0c0c10;color:#f5f5f7;font:14px system-ui}main{max-width:1500px;padding:30px;margin:auto}.pagebar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 26px}.brand{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700}.brand img{width:34px;height:34px;object-fit:contain}.pagebar span{color:#aaa5b4;font-size:11px}a{color:#ccc7db;text-decoration:none;font-size:12px}</style></head><body><main><header class="pagebar"><div class="brand"><img src="/Nova12.png" alt="Nova">Cosmetic Studio</div><span>Local preview · Try any look · No account changes</span><a href="/shop.html">Open Nova Shop ↗</a></header><div id="studio"></div></main><script type="module">import {mountCosmeticsStudio} from '/src/cosmetics-studio.mjs';const items=await(await fetch('/profile-assets/catalog.json')).json();const p={name:'Nova Player',username:'nova',bio:'A little personality. A look that’s yours.',photo:'/Nova12.png'};const ctx={state:{me:{uid:'preview'},assets:items,profiles:{preview:p}},person(){return p},avatar(){const n=document.createElement('span');n.className='avatar';const i=new Image();i.src=p.photo;i.alt='Nova player';n.append(i);return n}};const studio=mountCosmeticsStudio(document.querySelector('#studio'),ctx,{browseAll:true});const first=items.find(a=>a.name==='Star Chart · Frame')||items.find(a=>a.subtype==='frame');if(first)studio.select(first);</script></body></html>
