<!doctype html><html><head><meta charset="utf-8"><title>Nova playback check</title><style>body{background:#101012;color:#eee;font:15px system-ui;padding:24px}button{padding:12px;margin:8px;background:#eee;color:#111;border:0;border-radius:20px}iframe{width:100%;height:190px;border:0}pre{white-space:pre-wrap}#status{padding:20px;background:#202024;border-radius:16px}</style></head><body><h1>Nova playback check</h1><p>Real SoundCloud playback through Nova. One player, two songs.</p><button id="play">Play first song</button><button id="finish">Finish current song</button><button id="next">Next song</button><div id="mount"></div><pre id="status">Ready</pre><script type="module">
import {NovaMusicEngine} from '/src/nova-music-engine.mjs?v=20261016-sc115';
const tracks=[{id:'sc:55149736',title:'ODESZA — How Did I Get Here',duration:127.63},{id:'sc:1061010121',title:'Yeat — Sorry bout that',duration:182}];
const engine=new NovaMusicEngine({request:async(url,options)=>{if(String(url).includes('op=stream')){const id=new URL(url,location.href).searchParams.get('id').slice(3);return Response.json({mode:'soundcloud',widgetURL:'https://w.soundcloud.com/player/?auto_play=false&show_comments=false&url='+encodeURIComponent('https://api.soundcloud.com/tracks/'+id)})}return fetch(url,options)}});engine.providerMount=document.getElementById('mount');let at=0,started=0,first=0,finishes=0;
engine.addEventListener('change',()=>{const s=engine.snapshot;if(s.playing&&!first)first=Math.round(performance.now()-started);document.getElementById('status').textContent=JSON.stringify({song:s.track?.title,playing:s.playing,position:Math.round(s.position*10)/10,readyInMs:first,automaticTransitions:finishes,playerFrames:document.querySelectorAll('#mount>details>iframe').length,error:s.error},null,2)});
async function load(){started=performance.now();first=0;await engine.load(tracks[at]);engine.prepare(tracks[(at+1)%2]);}
engine.addEventListener('ended',()=>{finishes++;at=(at+1)%2;load()});document.getElementById('play').onclick=()=>{at=0;load()};document.getElementById('next').onclick=()=>{at=(at+1)%2;load()};document.getElementById('finish').onclick=()=>engine.seek(engine.snapshot.duration-1);window.addEventListener('pagehide',()=>engine.destroy());
</script></body></html>
