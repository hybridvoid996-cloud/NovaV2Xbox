<!doctype html><html><body style="background:#111;color:#fff;font:16px system-ui"><iframe credentialless id="sc" title="SoundCloud test" width="100%" height="166" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F2184736687&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false"></iframe><button id="play">Play</button><button id="seek">Seek to 50 seconds</button><button id="pause">Pause</button><pre id="status">Loading</pre><script src="https://w.soundcloud.com/player/api.js"></script><script>const w=SC.Widget(document.getElementById('sc')),s=document.getElementById('status');const state={};for(const e of ['READY','PLAY','PAUSE','PLAY_PROGRESS','ERROR','FINISH'])w.bind(SC.Widget.Events[e],data=>{state.event=e;if(data)state.data=data;if(e==='READY')w.getDuration(d=>{state.duration=d;s.textContent=JSON.stringify(state)});s.textContent=JSON.stringify(state)});document.getElementById('play').onclick=()=>w.play();document.getElementById('pause').onclick=()=>w.pause();document.getElementById('seek').onclick=()=>w.seekTo(50000);</script></body></html>
