customHeaders:
  - pattern: '**/*'
    headers:
      - key: Cross-Origin-Opener-Policy
        value: 'same-origin'
      - key: Cross-Origin-Embedder-Policy
        value: 'credentialless'
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, must-revalidate'
  - pattern: '/api/**'
    headers:
      - key: Cache-Control
        value: 'no-store'
